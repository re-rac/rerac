# Release: builds the version packages (tools/package/package.sh, macOS, Windows and Linux) and publishes them as a GitHub Release
# (docs/workflows/release.md). Cut a release by pushing a tag `vX.Y.Z[-pre]`; X.Y.Z must equal the workspace version.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0-alpha. Empty: build the package only (no release)."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The tag being released: the pushed tag, or the manual input (empty: package only).
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  # Optional secret (docs/workflows/release.md); here so a step's `if` can test it.
  SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}

jobs:
  # One package per platform. macOS Apple Silicon is the main tested one and Windows x64 has been run; Linux x64 is built
  # the same way and has never been run (fail-fast is off and the release job only requires the macOS package). Linux builds on
  # Ubuntu 22.04 so the binary runs on systems with glibc 2.35 or newer.
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-14
          - name: Windows x64
            platform: windows-latest
          - name: Linux x64 (untested)
            platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash # Git Bash on Windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag || github.ref }}

      - name: Rust toolchain (rustup, stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      # Bevy's system libraries on Linux: ALSA (audio), udev (gamepads), Wayland and xkbcommon (windows; X11 is loaded
      # at run time). `zip` packs the folder.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev zip

      - uses: Swatinem/rust-cache@v2

      # Release build of rerac + rerac-extract, then the allow-listed folder and its zip in dist/ (tools/package).
      # The script directly, not `cargo xtask package`: on Windows a bare `bash` can resolve to WSL's.
      - name: Package
        run: bash tools/package/package.sh

      - name: Find the package
        id: pkg
        run: |
          zip="$(ls dist/rerac-*.zip)"
          dir="${zip%.zip}"
          version="$(sed -n 's/.*"version":"\([^"]*\)".*/\1/p' "$dir/rerac-manifest.json")"
          ls -l "$zip" "$dir" "$dir/assets/shaders"
          if [ -n "$TAG" ]; then
            want="${TAG#v}"; want="${want%%-*}"
            if [ "$version" != "$want" ]; then
              echo "::error::tag $TAG does not match the workspace version $version (Cargo.toml [workspace.package])"
              exit 1
            fi
          fi
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "manifest=$dir/rerac-manifest.json" >> "$GITHUB_OUTPUT"

      - name: Upload the package (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: rerac-package-${{ matrix.platform }}
          path: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.manifest }}

  release:
    name: Publish release
    needs: build
    # Runs even when the untested Windows build failed; the check below decides.
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Collect the packages
        id: assets
        run: |
          mac="$(ls packages/rerac-package-macos-14/*macos-arm64.zip 2>/dev/null || true)"
          if [ -z "$mac" ]; then
            echo "::error::The macOS package is missing; nothing is released."
            exit 1
          fi
          files="$mac $(ls packages/rerac-package-macos-14/*/rerac-manifest.json)"
          win="$(ls packages/rerac-package-windows-latest/*windows-x86_64.zip 2>/dev/null || true)"
          if [ -n "$win" ]; then files="$files $win"; else echo "::warning::No Windows package in this release."; fi
          linux="$(ls packages/rerac-package-ubuntu-22.04/*linux-x86_64.zip 2>/dev/null || true)"
          if [ -n "$linux" ]; then files="$files $linux"; else echo "::warning::No Linux package in this release."; fi
          echo "files=$files" >> "$GITHUB_OUTPUT"

      # Notes: the CHANGELOG.md section `## <tag>`, else the tag's annotation.
      - name: Release notes
        run: |
          awk -v h="## $TAG" '$0 == h { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git tag -l --format='%(contents)' "$TAG" > notes.md
          fi
          cat notes.md

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ steps.assets.outputs.files }}
        run: |
          pre=""
          case "$TAG" in *-alpha*|*-beta*|*-rc*) pre="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --notes-file notes.md $pre
          else
            gh release create "$TAG" $FILES --verify-tag --title "ReRAC $TAG" --notes-file notes.md $pre
          fi

      # Optional: tell the site (re-rac/re-rac.github.io) to rebuild. Runs only when the repository secret
      # SITE_DISPATCH_TOKEN exists (a token allowed to create repository_dispatch events on the site repo).
      - name: Notify the site
        if: env.SITE_DISPATCH_TOKEN != ''
        run: |
          GH_TOKEN="$SITE_DISPATCH_TOKEN" gh api repos/re-rac/re-rac.github.io/dispatches \
            -f event_type=release-published -f "client_payload[tag]=$TAG" \
            -f "client_payload[repository]=$GITHUB_REPOSITORY"
