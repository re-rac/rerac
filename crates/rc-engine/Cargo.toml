[package]
name = "rc-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Faithful reimplementation runtime for Ratchet & Clank (PS2) on Bevy."

# The runtime executable is `rerac` (launcher contract); the crate stays `rc-engine` (`cargo dev`, `-p rc-engine`).
[[bin]]
name = "rerac"
path = "src/main.rs"

[features]
# `cargo run -p rc-engine --features dev` links Bevy as a dynamic library: seconds, not minutes, per rebuild.
dev = ["bevy/dynamic_linking"]

[dependencies]
bevy = "0.19"
rc-formats = { path = "../rc-formats" }
rc-game = { path = "../rc-game" }
# Decompressed lumps through the Tier 1 engine cache (once per process).
rc-data = { path = "../rc-data" }
# The movies (FMV): MPEG-2 video decoder and PSS player core, ours (docs/formats/pss.md).
rc-video = { path = "../rc-video" }
anyhow.workspace = true

# iOS port (crate::ios, crate::gc_pad): the first-run disc extraction and Bluetooth / MFi controllers.
[target.'cfg(target_os = "ios")'.dependencies]
rc-extract = { path = "../rc-extract" }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }
objc2-game-controller = { version = "0.3", default-features = false, features = ["std", "GCController", "GCExtendedGamepad", "GCPhysicalInputProfile", "GCControllerElement", "GCControllerButtonInput", "GCControllerAxisInput", "GCControllerDirectionPad", "GCDevice"] }
